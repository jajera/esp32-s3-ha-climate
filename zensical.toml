[project]
site_name = "ESP32-S3 HA climate"
site_description = "ESP32-S3 climate sensor for Home Assistant with SHT40 and ST7789 display"
site_url = "https://esp32-s3-ha-climate.johna.kiwi/"
nav = [
  { "Overview" = "index.md" },
  { "1. Walk through the code" = [
    "01-walkthrough/index.md",
    { "ESP32" = "01-walkthrough/board.md" },
    { "Home Assistant" = "01-walkthrough/home-assistant.md" },
    { "Wi‑Fi setup" = "01-walkthrough/wifi.md" },
    { "Sensors" = "01-walkthrough/sensors.md" },
    { "Display" = "01-walkthrough/display.md" },
    { "Factory reset" = "01-walkthrough/reset.md" },
  ]},
  { "2. Build the image" = "02-build-image.md" },
  { "3. Wire and validate" = [
    "03-wire/index.md",
    { "Breadboard" = "03-wire/breadboard.md" },
    { "ESP32" = "03-wire/esp32.md" },
    { "SHT40" = "03-wire/sht40.md" },
    { "Display" = "03-wire/display.md" },
    { "Validate" = "03-wire/validate.md" },
  ]},
  { "4. Flash the ESP32" = "04-flash-esp32.md" },
  { "5. Configure and test" = "05-configure-and-test.md" },
]

[project.theme]
name = "patina"
custom_dir = "overrides"
language = "en"
favicon = "assets/favicon.png"
logo = "assets/favicon.svg"
features = [
  "content.code.copy",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.emoji = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg", options = { custom_icons = ["overrides/.icons"] } }
pymdownx.highlight = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.tasklist" = { custom_checkbox = true, clickable_checkbox = true }
toc.permalink = true
zensical.extensions.glightbox = { width = "95vw", height = "auto", zoomable = true }
